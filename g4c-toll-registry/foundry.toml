[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.34"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./"}]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
base         = "https://base-rpc.publicnode.com"
